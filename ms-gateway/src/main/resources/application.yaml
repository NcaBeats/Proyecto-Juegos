server:
  port: 8090

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-usuario
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/usuarios/**

            - id: ms-profile
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/profiles/**

            - id: ms-purchase
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/purchases/**

            - id: ms-review
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/reviews/**

            - id: ms-wishlist
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/wishlists/**

            - id: ms-notification
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/notifications/**

            - id: ms-stats
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/stats/**

            - id: ms-library
              uri: http://localhost:8088
              predicates:
                - Path=/api/v1/library/**

            - id: ms-friendship
              uri: http://localhost:8089
              predicates:
                - Path=/api/v1/friendships/**

            - id: ms-juego
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/juegos/**,/api/v1/generos/**,/api/v1/plataformas/**,/api/v1/estudios/**

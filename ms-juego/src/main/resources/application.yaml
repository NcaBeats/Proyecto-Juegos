spring:
  application:
    name: ms-juego

  datasource:
    url: jdbc:postgresql://localhost:5432/db_juego
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG

server:
  port: 8080
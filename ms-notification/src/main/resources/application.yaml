spring:
  application:
    name: ms-notification

  datasource:
    url:  jdbc:h2:mem:db_notification
    driver-class-name: org.h2.Driver
    username: postgres
    password: 1234
  #  jdbc:postgresql://localhost:5432/db_review
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


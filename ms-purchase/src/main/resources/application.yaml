spring:
  application:
    name: ms-purchase

  datasource:
    url: jdbc:h2:mem:db_purchase
    driver-class-name: org.h2.Driver
    username: postgres
    password: 1234

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


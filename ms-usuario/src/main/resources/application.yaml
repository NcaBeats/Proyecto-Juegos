spring:
  application:
    name: ms-usuario

  datasource:
    url: jdbc:postgresql://localhost:5432/db_usuarios
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 1234

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: DEBUG

server:
  port: 8081